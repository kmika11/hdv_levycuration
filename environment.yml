# Hand-written rather than `conda env export`, which would pin ~200 transitive
# dependencies to macOS-specific builds and fail to solve on any other machine.
# These are the packages levy_curate actually imports.
#
#   conda env create -f environment.yml
#   conda activate curation
name: curation

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pandas>=2.0
  - numpy>=1.24
  - pyyaml>=6.0
  - requests>=2.31
  - openpyxl>=3.1          # reading the .xlsx metadata from Box
  - jupyter
  - rich
  - pytest>=7.0
  - pip
  - pip:
      - python-dotenv>=1.0
      - easyDataverse>=0.4
      - pyDataverse>=0.3
      - dvuploader>=0.2
